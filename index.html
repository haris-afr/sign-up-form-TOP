<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="page-body">
        <div class="sidebar">
            <img src="assets/sidebar_picture.avif" class="sidebar-picture">
            <div class="logo-box">
                <img src="assets/logo.png" class="logo-picture">
                <h1 class="logo-text">ODIN</h1>
            </div>
        </div>
        <div class="main-content">
            <div class="main-content-text-section">
                <p class="main-content-text">It took me a <strong>year</strong> to complete this</p>
                <p class="main-content-text">because I kept <em>procrastinating</em>.</p>
            </div>

            <div class="sign-up-form-box">
                <p class="sign-up-form-text">Let's do this!</p>
                <form action="example.com/path" method="post" class="main-form" id="account-creation-form">
                    <div class="form-element">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first-name" required placeholder="John">
                    </div>

                    <div class="form-element">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last-name" required placeholder="Smith">
                    </div>

                    <div class="form-element">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" required placeholder="JohnSmith@XYZ.com">
                    </div>

                    <div class="form-element">
                        <label for="user-phone-number">Phone Number</label>
                        <input type="tel" id="user-phone-number" required placeholder="+XX XXX XXXXXX">
                    </div>
                    
                    <div class="form-element">
                        <label for="user-password">Password</label>
                        <input type="password" id="user-password" required minlength="8" pattern="^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$\s%^&*\-]).{8,}$" placeholder="Min 8 characters">
                    </div>
                    
                    <div class="form-element">
                        <label for="user-confirm-password">Confirm Password</label>
                        <input type="password" id="user-confirm-password" required minlength="8" pattern="^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$\s%^&*\-]).{8,}$"" placeholder="*********">
                    </div>
                </form>
            </div>

            <div class="account-section">
                <button type="submit" class="create-account-button" form="account-creation-form">Create Account</button>
                <p>Already have an account? <a href="www.example.com">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
